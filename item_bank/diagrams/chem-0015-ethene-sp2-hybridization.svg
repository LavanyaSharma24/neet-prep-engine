<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 320" font-family="system-ui, sans-serif">
  <rect x="1" y="1" width="418" height="318" rx="10" fill="#fafafa" stroke="#e5e7eb" stroke-width="2" />

  <text x="210" y="26" text-anchor="middle" font-size="15" font-weight="600" fill="#111827">
    Ethene (C2H4): sp² Hybridization and the π Bond
  </text>

  <!-- pi-bond p-orbital clouds, above and below the C=C sigma bond -->
  <ellipse cx="210" cy="128" rx="80" ry="34" fill="#60a5fa" fill-opacity="0.5" stroke="#2563eb" stroke-width="1.5" />
  <ellipse cx="210" cy="252" rx="80" ry="34" fill="#60a5fa" fill-opacity="0.5" stroke="#2563eb" stroke-width="1.5" />

  <!-- sp2 sigma-bond skeleton: trigonal planar, 120 degrees at each carbon -->
  <line x1="150" y1="190" x2="270" y2="190" stroke="#1f2937" stroke-width="2" />
  <line x1="150" y1="190" x2="110" y2="121" stroke="#1f2937" stroke-width="2" />
  <line x1="150" y1="190" x2="110" y2="259" stroke="#1f2937" stroke-width="2" />
  <line x1="270" y1="190" x2="310" y2="121" stroke="#1f2937" stroke-width="2" />
  <line x1="270" y1="190" x2="310" y2="259" stroke="#1f2937" stroke-width="2" />

  <!-- 120 degree angle marker at C1 -->
  <path d="M 128 176 A 26 26 0 0 1 122 203" fill="none" stroke="#9ca3af" stroke-width="1.5" />
  <text x="112" y="188" font-size="10" fill="#6b7280">120°</text>

  <!-- Carbon atoms -->
  <circle cx="150" cy="190" r="11" fill="#374151" />
  <text x="150" y="194" text-anchor="middle" font-size="11" fill="#ffffff" font-weight="600">C</text>
  <circle cx="270" cy="190" r="11" fill="#374151" />
  <text x="270" y="194" text-anchor="middle" font-size="11" fill="#ffffff" font-weight="600">C</text>

  <!-- Hydrogen atoms -->
  <circle cx="110" cy="121" r="9" fill="#e5e7eb" stroke="#374151" stroke-width="1.5" />
  <text x="110" y="125" text-anchor="middle" font-size="10" fill="#374151">H</text>
  <circle cx="110" cy="259" r="9" fill="#e5e7eb" stroke="#374151" stroke-width="1.5" />
  <text x="110" y="263" text-anchor="middle" font-size="10" fill="#374151">H</text>
  <circle cx="310" cy="121" r="9" fill="#e5e7eb" stroke="#374151" stroke-width="1.5" />
  <text x="310" y="125" text-anchor="middle" font-size="10" fill="#374151">H</text>
  <circle cx="310" cy="259" r="9" fill="#e5e7eb" stroke="#374151" stroke-width="1.5" />
  <text x="310" y="263" text-anchor="middle" font-size="10" fill="#374151">H</text>

  <text x="210" y="80" text-anchor="middle" font-size="12" fill="#1e3a8a">
    π bond — leftover p orbital on each carbon, perpendicular to the plane
  </text>
  <text x="210" y="300" text-anchor="middle" font-size="12" fill="#374151">
    sp² σ framework — 3 sigma bonds per carbon, trigonal planar, ~120°
  </text>
</svg>
